<!doctype html>
<html
  lang="en"
  {% if page.bibliography %}
    data-bibliography="{{ page.bibliography | relative_url }}"
  {% endif %}
>
  <head>
    {% include analytics.html %}
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="{{ page.description | default: site.data.profile.description | escape }}"
    />
    <link
      rel="icon"
      href="{{ '/favicon.ico' | relative_url }}"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      sizes="any"
      href="{{ '/images/favicon.svg' | relative_url }}"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{{ '/images/apple-touch-icon.png' | relative_url }}"
    />
    <title>
      {% if page.title %}{{ page.title }} — {% endif %}{{ site.data.profile.name }}
    </title>
    <link
      rel="stylesheet"
      href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}"
    />
    <script
      src="{{ '/config.js' | relative_url }}?v={{ site.time | date: '%s' }}"
    ></script>
    <script src="{{ '/assets/latent-field.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
    {% if page.math %}
      <script>
        window.MathJax = {
          tex: {
            inlineMath: [["\\(", "\\)"], ["$", "$"]],
            displayMath: [["\\[", "\\]"], ["$$", "$$"]],
          },
        };
      </script>
      <script
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
        defer
      ></script>
    {% endif %}
    {% if page.bibliography %}
      <script src="{{ '/assets/citations.js' | relative_url }}" defer></script>
    {% endif %}
  </head>
  <body>
    <div class="site-frame">
      {% include header.html %}
      {{ content }}
      {% include footer.html %}
    </div>
  </body>
</html>
