heading: "Current work"
role: "AI Research Engineer"
focus: "Recommendation Systems"
summary: "Built and deployed an end-to-end recommendation platform for a large Indian OTT service, covering data quality, GPU training, batch inference, evaluation and production serving for 10M+ users."

metrics_label: "Key metrics"
metrics:
  - "11.24M users with personalised recommendations"
  - "5 models trained on 1.1B viewing events"
  - "8-month retraining: crashes -> 6.2 h"
  - "62% -> 9.5% generic fallbacks"
  - "Continue Series hit rate 92.5%"
  - "1.7M objects released to production"

projects_label: "Recommendation systems projects"
projects:
  - title: "RAG and semantic search"
    badge: "In progress"
    bullets:
      - "Building natural-language content search and recommendation explanations using RAG, sentence-transformer embeddings, Qdrant hybrid retrieval and re-ranking."

  - title: "Vector search and real-time serving"
    badge: "In progress"
    bullets:
      - "Designed self-hosted Qdrant retrieval and Valkey caching for 10M+ users, with FAISS for GPU batch scoring and session-aware recommendations on Kubernetes (EKS)."

  - title: "Production release"
    badge: "1.7M objects"
    bullets:
      - "Released full-data recommendation carousels to AWS S3, moving 1.7M objects onto the live serving path with validated rollback and completion signalling."

  - title: "Evaluation framework"
    badge: "300K+ users"
    bullets:
      - "Built time-split offline evaluation using Hit Rate@10, Recall@10 and NDCG@10 across 300K+ users."
      - "Automated cohort-level reports comparing recommendations with real watch history to guide model and carousel releases."

  - title: "Scenario routing"
    badge: "92.5% hit rate"
    bullets:
      - "Routed 11.24M users across Continue Series, Welcome Back and Onboarding based on lifecycle state."
      - "Achieved 92.5% Continue Series hit rate and about 40% Welcome Back hit rate, approximately 2.3x the previous baseline."

  - title: "Batch inference for every user"
    badge: "more than 30x faster"
    bullets:
      - "Accelerated full-user batch inference by more than 30x through larger batches, local data and parallel scoring."
      - "Generated personalised carousels for 11.24M users, reducing generic fallbacks from 62% to 9.5% and raising serial hit rate from 69% to 82%."

  - title: "Data-quality discovery"
    badge: "36% -> 100%"
    bullets:
      - "Diagnosed a stale content catalogue that excluded 63% of July-August viewing data from training."
      - "Rebuilt the catalogue from raw CMS data, increasing matched events from 36% to 100% and training rows from 23M to 76M."

  - title: "GPU training at scale"
    badge: "6.2 h"
    bullets:
      - "Made 8-month training stable for all five models and reduced retraining to 6.2 hours, with 40-100x faster processing per training row."
      - "Processed 1.1B events into 371M training rows while cutting data loading from hours to minutes and peak RAM from 54 GB to 22 GB."
      - "Training on full data improved Recall@10 from 0.70 to 0.83 for Two-Tower and from 0.42 to 0.57 for Matrix Factorization."

  - title: "End-to-end recommendation platform"
    badge: "5 models"
    bullets:
      - "Developed five recommenders: Matrix Factorization, Two-Tower, SASRec, content-based and collaborative filtering."
      - "Produced 11 personalised carousels spanning trending, contextual, collaborative, cold-start and lifecycle-based recommendations."
      - "Built language- and region-aware ranking that combines model scores with recent and long-term user preferences."

stack_heading: "Technical stack"
stack:
